#
# A published GitHub release builds the Debian package of its tag and attaches
# it to the release: omniacli_<version>_all.deb, and OmniaCLI.deb, whose link
# never changes (releases/latest/download/OmniaCLI.deb).
#
# The tag is the version: omniacli-v<year>.1.<n> (or v<year>.1.<n>).
# Run by hand (Actions > Release > Run workflow) with the tag of an existing
# release, it builds and attaches that release's package again.
# The tests run first; the package is then installed and checked in Debian 12
# and Ubuntu 24.04 containers with systemd (packaging/debian/test_deb.sh).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to build, e.g. omniacli-v2026.1.7"
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    # the suite takes about 18-20 minutes on a runner (1940 tests, 24/11/2026): a test that hangs ends the job
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[test]'
      - name: Tests
        # a test still running after 5 minutes prints where every thread is
        run: pytest -q -o faulthandler_timeout=300

  package:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Version from the tag
        id: version
        run: |
          version="${TAG#omniacli-v}"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]{4}\.1\.[0-9]+$ ]] || { echo "tag $TAG is not omniacli-v<year>.1.<n>"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the package
        env:
          PYTHON: python
        run: packaging/debian/build_deb.sh --ci "${{ steps.version.outputs.version }}" dist
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "dist/omniacli_${VERSION}_all.deb" dist/OmniaCLI.deb
          cp "dist/omniacli-workspaces_${VERSION}_all.deb" dist/OmniaCLI-workspaces.deb
          gh release upload "$TAG" "dist/omniacli_${VERSION}_all.deb" dist/OmniaCLI.deb \
            "dist/omniacli-workspaces_${VERSION}_all.deb" dist/OmniaCLI-workspaces.deb --clobber
      - name: Sign the package for the update from the panel
        # README, Update OmniaCLI: a machine installs a package from its panel only when the signed manifest
        # next to it (OmniaCLI.deb.json, .json.sig) verifies with its key. The private key of omniacli package-key
        # and its passphrase are secrets of the repository; without them the release is not signed, and is
        # installed by hand.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OMNIACLI_PACKAGE_KEY: ${{ secrets.OMNIACLI_PACKAGE_KEY }}
          OMNIACLI_KEY_PASSPHRASE: ${{ secrets.OMNIACLI_KEY_PASSPHRASE }}
        run: |
          if [ -z "$OMNIACLI_PACKAGE_KEY" ]; then
            echo "no secret OMNIACLI_PACKAGE_KEY: the package is not signed, the machines do not install it from their panel"
            exit 0
          fi
          pip install -q -e .
          key="$RUNNER_TEMP/package.key"
          (umask 077; printf '%s\n' "$OMNIACLI_PACKAGE_KEY" > "$key")
          omniacli package-sign --key "$key" dist/OmniaCLI.deb
          rm -f "$key"
          gh release upload "$TAG" dist/OmniaCLI.deb.json dist/OmniaCLI.deb.json.sig dist/OmniaCLI.deb.sha256 --clobber
      - uses: actions/upload-artifact@v6
        with:
          name: deb
          path: dist/omniacli_${{ steps.version.outputs.version }}_all.deb

  install-test:
    needs: package
    # the package is the same for both: installed on an amd64 and an arm64 machine
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v7
        with:
          name: deb
          path: dist
      - name: Install and check in containers with systemd
        run: packaging/debian/test_deb.sh dist/omniacli_${{ needs.package.outputs.version }}_all.deb debian:12 ubuntu:24.04
