# Odoo 16 Community (the official image odoo:16.0) and PostgreSQL 17: a template of OmniaCLI's
# workspaces (docs/workspaces.md). OmniaCLI writes .env (the variables below)
# and config/odoo.conf; filestore and database are folders of the instance,
# on its workspace's disk; the ports listen on this machine only, the network
# is one OmniaCLI's firewall knows (SUBNET), the containers are in the
# workspace's systemd slice, its CPU and memory (SLICE). The containers' own
# files are read only: what they write goes on the disk (Odoo's /tmp, where
# dumps and loads are staged) or into a small tmpfs, never onto docker's disk.
# The database's superuser is postgres, with a password Odoo does not know;
# Odoo's role, made by dbinit/ at the first start, is no superuser.
# PostgreSQL 17, as every template: the image's pg_dump (17.6 in odoo:16.0 of
# 2025-09-09) dumps it and would refuse a newer server; Odoo 16 sets no
# minimum (10 and later). Its Odoo runs as uid 101 (data/filestore, data/tmp).
name: ${PROJECT}
networks:
  default:
    ipam:
      config:
        - subnet: ${SUBNET}
services:
  odoo:
    image: ${IMAGE}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 1024
    cgroup_parent: ${SLICE}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT}:8069"
      - "127.0.0.1:${WEBSOCKET_PORT}:8072"
    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: ${DB_PASSWORD}
      # the same connection for a command typed in the container (odoo shell,
      # click-odoo, psql): the image's entrypoint reads HOST..., they read PG*
      PGHOST: db
      PGPORT: "5432"
      PGUSER: odoo
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/filestore:/var/lib/odoo
      - ./data/tmp:/tmp
      # a volume of the image, otherwise an anonymous one on docker's disk
      - ./data/extra-addons:/mnt/extra-addons:ro
      - ./config:/etc/odoo:ro
      # the customer's repositories of this role (production or test)
      - ./addons:/mnt/customer-addons:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  db:
    # PostgreSQL 17 with pgvector (the extension vector, which the ai module of Odoo
    # Enterprise 19 needs): postgres:17 of the same Debian with the extension, a drop-in on
    # its data folder; harmless where nothing uses it. dbinit/ makes the template database
    # with vector that odoo.conf names (db_template): Odoo's role may not make it
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=16m
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # the image's entrypoint, as root: gives its folders to postgres and drops to it
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 512
    cgroup_parent: ${SLICE}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SUPER_PASSWORD}
      ODOO_DB_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data/pgdata
      - ./dbinit:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  # a staging's mail, caught (UX-008 §5.3): Mailpit (MIT), only with
  # COMPOSE_PROFILES=mail-capture in .env, which the helper writes for a
  # staging. A neutralized database sends through the server odoo neutralize
  # adds, host "invalid" port 1025 (base/data/neutralize.sql, Odoo 16 to 20):
  # that name is this service in the project's network, as "mail" is, the
  # smtp_server of the staging's odoo.conf. No port published: its API listens
  # on the loopback of its container only, read by compose-helper mail-*.
  # Odoo 16 has no alias domain (mail.alias.domain, Odoo 17 and later), which
  # the mailboxes of a staging need (odoo/mail_inbox.py): no service inbox,
  # nothing handed on, the outgoing mail caught only.
  mail:
    image: axllent/mailpit:v1.33.1
    profiles: ["mail-capture"]
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    cgroup_parent: ${SLICE}
    networks:
      default:
        aliases:
          - invalid
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 127.0.0.1:8025
      MP_MAX_MESSAGES: "500"
      MP_DISABLE_VERSION_CHECK: "true"
    volumes:
      - ./data/mail:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
